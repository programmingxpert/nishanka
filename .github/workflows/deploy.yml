name: Deploy Nishanka

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to AWS EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ec2-user
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            cd /home/ec2-user/nishanka
            git fetch origin main
            git reset --hard origin/main
            npm install
            pm2 delete nishanka || true
            rm -f /home/ec2-user/nishanka/bot.lock
            pm2 start index.js --name nishanka --instances 1 --exec-mode fork
            pm2 save
            sleep 5
            test "$(pm2 pid nishanka)" != "0"
