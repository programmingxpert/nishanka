name: Deploy Nishanka

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to AWS EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ec2-user
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            cd /home/ec2-user/nishanka
            git fetch origin main
            git reset --hard origin/main
            npm install
            test -s /home/ec2-user/nishanka/.env
            node -e "require('dotenv').config({ override: true }); if (!process.env.TOKEN || !process.env.MONGO_URI) process.exit(1)"
            rm -f /home/ec2-user/nishanka/bot.lock
            LOG_FILE="$HOME/.pm2/logs/nishanka-out.log"
            ERROR_LOG="$HOME/.pm2/logs/nishanka-error.log"
            BEFORE_LINES=$(wc -l < "$LOG_FILE" 2>/dev/null || echo 0)
            BEFORE_ERROR_LINES=$(wc -l < "$ERROR_LOG" 2>/dev/null || echo 0)
            if pm2 describe nishanka >/dev/null 2>&1; then
              pm2 restart nishanka --update-env
            else
              pm2 start index.js --name nishanka --instances 1 --exec-mode fork
            fi
            pm2 save
            for attempt in $(seq 1 12); do
              if tail -n +$((BEFORE_LINES + 1)) "$LOG_FILE" 2>/dev/null | grep -q "Bot is online as"; then
                exit 0
              fi
              sleep 5
            done
            NEW_ERRORS=$(tail -n +$((BEFORE_ERROR_LINES + 1)) "$ERROR_LOG" 2>/dev/null || true)
            if printf '%s' "$NEW_ERRORS" | grep -q "Discord login failed"; then
              echo "Deployment diagnosis: Discord login failed. Check the VPS token."
            elif printf '%s' "$NEW_ERRORS" | grep -q "MongoDB connection failed"; then
              echo "Deployment diagnosis: MongoDB connection failed. Check the VPS connection string or network access."
            elif printf '%s' "$NEW_ERRORS" | grep -q "Another instance of Nishanka"; then
              echo "Deployment diagnosis: another bot process is holding the instance lock."
            elif printf '%s' "$NEW_ERRORS" | grep -q "EADDRINUSE"; then
              echo "Deployment diagnosis: the bot API port is already in use."
            else
              echo "Deployment diagnosis: Discord readiness timed out without a recognized startup error."
            fi
            pm2 describe nishanka | grep -E "status|restarts|pid" || true
            exit 1
