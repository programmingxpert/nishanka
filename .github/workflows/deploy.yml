name: Deploy Nishanka

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to AWS EC2
        id: deploy
        uses: appleboy/ssh-action@v1.2.1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ec2-user
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          capture_stdout: true
          script: |
            cd /home/ec2-user/nishanka
            git fetch origin main
            git reset --hard origin/main
            npm install
            test -s /home/ec2-user/nishanka/.env
            node -e "require('dotenv').config({ override: true }); if (!process.env.TOKEN || !process.env.MONGO_URI) process.exit(1)"
            rm -f /home/ec2-user/nishanka/bot.lock /home/ec2-user/nishanka/bot.ready
            LOG_FILE="/home/ec2-user/nishanka/pm2-out.log"
            ERROR_LOG="/home/ec2-user/nishanka/pm2-error.log"
            APP_LOG="/home/ec2-user/nishanka/bot.log"
            BEFORE_APP_LINES=$(wc -l < "$APP_LOG" 2>/dev/null || echo 0)
            pm2 delete nishanka >/dev/null 2>&1 || true
            rm -f /home/ec2-user/nishanka/bot.lock /home/ec2-user/nishanka/bot.ready
            : > "$LOG_FILE"
            : > "$ERROR_LOG"
            PM2_START_OUTPUT=$(pm2 start index.js --name nishanka --instances 1 --exec-mode fork --cwd /home/ec2-user/nishanka --output "$LOG_FILE" --error "$ERROR_LOG" 2>&1) || PM2_START_FAILED=1
            pm2 save
            for attempt in $(seq 1 12); do
              if test -s /home/ec2-user/nishanka/bot.ready; then
                echo "NISHANKA_DEPLOY_RESULT=READY"
                exit 0
              fi
              sleep 5
            done
            NEW_OUTPUT=$(cat "$LOG_FILE" 2>/dev/null || true)
            NEW_ERRORS=$(cat "$ERROR_LOG" 2>/dev/null || true)
            NEW_APP_LOG=$(tail -n +$((BEFORE_APP_LINES + 1)) "$APP_LOG" 2>/dev/null || true)
            STARTUP_LOG=$(printf '%s\n%s\n%s' "$NEW_OUTPUT" "$NEW_ERRORS" "$NEW_APP_LOG")
            PM2_STATE=$(pm2 jlist 2>/dev/null | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{const p=JSON.parse(s).find(x=>x.name==='nishanka');console.log(p ? [p.pm2_env.status,p.pm2_env.exit_code,p.pm2_env.unstable_restarts].join(':') : 'missing')}catch{console.log('invalid')}})")
            if test "${PM2_START_FAILED:-0}" = "1"; then
              echo "NISHANKA_DEPLOY_RESULT=PM2_START_COMMAND_FAILED"
            elif printf '%s' "$STARTUP_LOG" | grep -q "Discord login failed"; then
              echo "NISHANKA_DEPLOY_RESULT=DISCORD_LOGIN_FAILED"
            elif printf '%s' "$STARTUP_LOG" | grep -q "MongoDB connection failed"; then
              echo "NISHANKA_DEPLOY_RESULT=MONGODB_FAILED"
            elif printf '%s' "$STARTUP_LOG" | grep -q "Another instance of Nishanka"; then
              echo "NISHANKA_DEPLOY_RESULT=INSTANCE_LOCKED"
            elif printf '%s' "$STARTUP_LOG" | grep -q "EADDRINUSE"; then
              echo "NISHANKA_DEPLOY_RESULT=PORT_IN_USE"
            elif printf '%s' "$STARTUP_LOG" | grep -q "Discord gateway ready timeout"; then
              echo "NISHANKA_DEPLOY_RESULT=DISCORD_GATEWAY_TIMEOUT"
            elif printf '%s' "$STARTUP_LOG" | grep -q "Cannot find module\|MODULE_NOT_FOUND"; then
              echo "NISHANKA_DEPLOY_RESULT=MISSING_MODULE"
            elif printf '%s' "$STARTUP_LOG" | grep -q "SyntaxError\|Unexpected token"; then
              echo "NISHANKA_DEPLOY_RESULT=NODE_SYNTAX_ERROR"
            elif printf '%s' "$STARTUP_LOG" | grep -q "Failed to initialize log file\|EACCES"; then
              echo "NISHANKA_DEPLOY_RESULT=FILE_PERMISSION_ERROR"
            elif printf '%s' "$STARTUP_LOG" | grep -q "ReferenceError\|TypeError\|RangeError"; then
              echo "NISHANKA_DEPLOY_RESULT=NODE_RUNTIME_ERROR"
            elif printf '%s' "$STARTUP_LOG" | grep -q "Bot Internal API running"; then
              echo "NISHANKA_DEPLOY_RESULT=DISCORD_GATEWAY_TIMEOUT"
            elif pm2 pid nishanka 2>/dev/null | grep -Eq '^[1-9][0-9]*$'; then
              echo "NISHANKA_DEPLOY_RESULT=STARTUP_STALLED"
            elif printf '%s' "$PM2_STATE" | grep -Eq ':(137|143):'; then
              echo "NISHANKA_DEPLOY_RESULT=PROCESS_KILLED"
            elif printf '%s' "$PM2_STATE" | grep -q '^errored:'; then
              echo "NISHANKA_DEPLOY_RESULT=PM2_RESTART_LOOP"
            else
              echo "NISHANKA_DEPLOY_RESULT=PROCESS_NOT_STARTED"
            fi
            exit 0

      - name: Verify bot readiness
        env:
          DEPLOY_OUTPUT: ${{ steps.deploy.outputs.stdout }}
        run: |
          if printf '%s' "$DEPLOY_OUTPUT" | grep -q 'NISHANKA_DEPLOY_RESULT=READY'; then
            exit 0
          elif printf '%s' "$DEPLOY_OUTPUT" | grep -q 'NISHANKA_DEPLOY_RESULT=DISCORD_LOGIN_FAILED'; then
            echo '::error title=Discord login failed::The VPS Discord token is invalid or rejected.'
          elif printf '%s' "$DEPLOY_OUTPUT" | grep -q 'NISHANKA_DEPLOY_RESULT=MONGODB_FAILED'; then
            echo '::error title=MongoDB connection failed::Check the VPS connection string and database network access.'
          elif printf '%s' "$DEPLOY_OUTPUT" | grep -q 'NISHANKA_DEPLOY_RESULT=INSTANCE_LOCKED'; then
            echo '::error title=Bot instance locked::Another bot process is still running on the VPS.'
          elif printf '%s' "$DEPLOY_OUTPUT" | grep -q 'NISHANKA_DEPLOY_RESULT=PORT_IN_USE'; then
            echo '::error title=Bot API port in use::Another process is using the configured bot port.'
          elif printf '%s' "$DEPLOY_OUTPUT" | grep -q 'NISHANKA_DEPLOY_RESULT=PROCESS_NOT_STARTED'; then
            echo '::error title=PM2 process failed::PM2 did not start the bot entry point.'
          elif printf '%s' "$DEPLOY_OUTPUT" | grep -q 'NISHANKA_DEPLOY_RESULT=PM2_START_COMMAND_FAILED'; then
            echo '::error title=PM2 launch command failed::PM2 rejected the bot process configuration.'
          elif printf '%s' "$DEPLOY_OUTPUT" | grep -q 'NISHANKA_DEPLOY_RESULT=PROCESS_KILLED'; then
            echo '::error title=Bot process killed::The VPS terminated Node during startup, commonly due to low memory.'
          elif printf '%s' "$DEPLOY_OUTPUT" | grep -q 'NISHANKA_DEPLOY_RESULT=PM2_RESTART_LOOP'; then
            echo '::error title=PM2 restart loop::The bot exits immediately until PM2 marks it errored.'
          elif printf '%s' "$DEPLOY_OUTPUT" | grep -q 'NISHANKA_DEPLOY_RESULT=DISCORD_GATEWAY_TIMEOUT'; then
            echo '::error title=Discord gateway timeout::The app started but did not establish its Discord gateway session.'
          elif printf '%s' "$DEPLOY_OUTPUT" | grep -q 'NISHANKA_DEPLOY_RESULT=MISSING_MODULE'; then
            echo '::error title=Node module missing::The production dependency installation is incomplete.'
          elif printf '%s' "$DEPLOY_OUTPUT" | grep -q 'NISHANKA_DEPLOY_RESULT=NODE_SYNTAX_ERROR'; then
            echo '::error title=Node syntax error::The VPS Node.js runtime cannot parse the application.'
          elif printf '%s' "$DEPLOY_OUTPUT" | grep -q 'NISHANKA_DEPLOY_RESULT=FILE_PERMISSION_ERROR'; then
            echo '::error title=VPS file permission error::The bot cannot write its runtime files.'
          elif printf '%s' "$DEPLOY_OUTPUT" | grep -q 'NISHANKA_DEPLOY_RESULT=NODE_RUNTIME_ERROR'; then
            echo '::error title=Node startup exception::The application threw an exception before Discord became ready.'
          elif printf '%s' "$DEPLOY_OUTPUT" | grep -q 'NISHANKA_DEPLOY_RESULT=STARTUP_STALLED'; then
            echo '::error title=Bot startup stalled::Node started but did not reach the API or Discord readiness checkpoints.'
          else
            echo '::error title=Bot readiness timeout::The bot did not reach Discord ready and emitted no recognized startup error.'
          fi
          exit 1
